syntax = "proto3";

package controllerrpc;

import "common.proto";

service ControllerService {
        // Endpoints for collectors to call.
        rpc RegisterCollector(common.CollectorInfo) returns (RegisterCollectorResponse);
        rpc CollectorStatus(common.CollectorInfo) returns (CollectorStatusResponse);
        rpc OpenChannel(OpenCollectorChannelRequest) returns (OpenCollectorChannelResponse);
        rpc UpdateChannels(UpdateChannelsRequest) returns (UpdateChannelsResponse);
        rpc PostGossipGraphChunk(common.GossipGraphChunk) returns (common.GossipGraphChunkResponse);
        // Endpoints for the operator to use.
        rpc Status(StatusRequest) returns (StatusResponse);
        rpc Shutdown(common.ShutdownRequest) returns (common.ShutdownResponse);
}

// We'll reply to the collector by calling their endpoints, not in these replies.
message RegisterCollectorResponse {}

message CollectorStatusResponse {}

message StatusRequest {}

message CollectorHeartbeatDisplay {
        // Seconds relative to now: negative means the heartbeat was received
        // that many seconds ago.
        int32 heartbeat_age_secs = 1;
        common.CollectorInfoDisplay info = 2;
}

// list collectors, peer count, target count. Operator-facing: uses the
// human-readable *Display message variants.
message StatusResponse {
        uint32 total_target_peer_count = 1;
        uint32 current_peer_count = 2;
        uint32 online_collector_count = 3;
        uint32 offline_collector_count = 4;
        repeated string offline_collectors = 5;
        repeated CollectorHeartbeatDisplay statuses = 6;
}

message OpenCollectorChannelRequest {
        string uuid = 1;
        common.OpenChannelRequest request = 2;
}

message OpenCollectorChannelResponse {
        string uuid = 1;
        common.OpenChannelResponse response = 2;
}

message UpdateChannelsRequest {
        string uuid = 1;
}

message UpdateChannelsResponse {
        string uuid = 1;
        common.UpdateChannelConfigResponse response = 2;
}
