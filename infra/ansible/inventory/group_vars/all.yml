locale: "en_US.UTF-8"
nonroot_username: "goss"
ansible_user: "{{ nonroot_username }}"
hostfile_path: "/inventory/hosts.ini"
# Every 4 hours
apt_cache_stale: 14400

bash_config:
  - { line: "set -o vi" }
  - { line: "HISTSIZE=100000", regexp: "^HISTSIZE=" }
  - { line: "HISTFILESIZE=200000", regexp: "^HISTFILESIZE=" }
  - { line: "shopt -s cmdhist" }

nats_version: "2.12.14"

# JetStream file-store cap PER INSTANCE (staging + prod can each grow to this).
# Compare to a message ingest rate of 2-4 Mb/s from all 21 collectors / 600 peers.
nats_file_store: 17179869184

# Base dir for the per-instance JetStream stores ({base}/nats_staging,
# {base}/nats_prod).
# NOTE: changing this on a live host moves the store path but NOT the data.
# Stop both nats services, `rsync -a` the old dirs onto the volume, then re-run
# config_nats.yml (stream + durable-consumer state live in these dirs).
nats_store_dir_base: "/var/lib"

nats_instances:
  - name: staging
    service_name: nats-server-staging
    port: 4223
    http_port: 8223
  - name: prod
    service_name: nats-server-prod
    port: 4224
    http_port: 8224

# NATS server, used in both archiver and collector configs
nats_server_addr_staging: "do-small-test:4223"
nats_server_addr_prod: "do-small-test:4224"

controller_staging: "http://do-medium:50060"
controller_prod: "http://do-medium:50061"

postgresql_version: "18"
# Exact package pins for every [timescale] host. Physical replication and
# file-level copies require byte-identical server + extension .so versions
# across hosts, and pg_dump/restore requires matching extension versions — so
# these are pinned and apt-mark held rather than 'state: present' latest.
# Values discovered from do-medium (dpkg -l | grep -E 'postgresql-18|timescaledb').
# The matching .debs are staged in infra/ansible/pgdg_cache/ (gitignored) —
# PGDG's repo only serves the latest minor, so PostgreSQL installs from there.
# To upgrade: bump here, then apply to ALL timescale hosts in one maintenance
# window with the archivers stopped first (ack-before-write loses messages if
# postgres restarts under a running archiver).
postgresql_package_version: "18.1-1.pgdg13+2"
timescaledb_package_version: "2.24.0~debian13-1801"
timescaledb_toolkit_package_version: "1:1.22.0~debian13"
timescaledb_tools_package_version: "0.18.1~debian13"
# PGDATA location, written into postgresql.conf by tasks/timescaledb.yml.
# Debian's default; override per host in inventory/host_vars/<host>.yml when
# the cluster lives on a separate volume (do-medium does). NOTE: the playbook
# only writes the setting — relocating an EXISTING cluster is manual:
# stop postgres → rsync -a old/ new/ → set the override → re-run the playbook.
postgresql_data_directory: "/var/lib/postgresql/{{ postgresql_version }}/main"
timescaledb_database_name: "gossip_observer"
timescaledb_staging_database_name: "gossip_observer_staging"

# Binary staging directory for deployments
binary_staging_dir: "{{ playbook_dir }}/binaries"
service_startup_wait: 45
