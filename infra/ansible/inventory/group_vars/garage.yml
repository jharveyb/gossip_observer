# Garage (self-hosted S3) group variables.
# See https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

garage_version: "2.3.0"

# --- Storage layout ---
# metadata_dir is fixed under /var/lib/garage/meta (the systemd unit uses
# StateDirectory=garage). data_dir can be pointed at a separately-mounted
# disk by overriding this variable in host_vars; e.g. a large block-storage
# volume mounted at /mnt/garage-data. The playbook detects "external" paths
# (anything outside /var/lib/garage/) and pre-creates them with the right
# ownership + adds them to the service's ReadWritePaths.

# Putting this in the Vault since it'd possibly sensitive
# garage_data_dir: "/var/lib/garage/data"

# --- Network ---
# When co-located with Caddy (or rclone running on the same host), keep the S3
# and admin listeners on loopback and let Caddy expose the public endpoint.
# Override in host_vars if Garage must be reachable on a private network.
garage_s3_api_bind_addr: "127.0.0.1:3900"

# Specify ports here; we'll bind on our Tailscale IP in the Garage conf file.
garage_admin_bind_port: 3903
garage_rpc_bind_port: 3901

# --- Metadata / storage engine ---
# SQLite is slower than LMDB but portable across architectures and much less
# prone to corruption after unclean shutdowns. At our scale (a few hundred
# daily Parquet objects), the performance difference is irrelevant.
garage_db_engine: "sqlite"
# fsync metadata writes — recommended with SQLite for durability across
# crashes. Writes become moderately slower but the tradeoff is worth it.
garage_metadata_fsync: true
# Auto-snapshot the metadata DB for corruption recovery. Only the two most
# recent snapshots are retained.
garage_metadata_snapshot_interval: "6h"

# --- Cluster ---
# Replication factor: how many copies of each object to keep across nodes.
# 1 = no redundancy (single-node default).
#
# DO NOT change this on a live cluster by editing this variable. Since Garage
# 1.0 the factor is stored IN THE CLUSTER LAYOUT, and a node whose config
# disagrees with its stored layout refuses to start:
#
#   Previous cluster layout has replication factor N, which is different than
#   the one specified in the config file (M). The previous cluster layout can
#   be purged [...] by deleting the `cluster_layout` file in your metadata
#   directory.
#
# So bumping this and re-running the playbook does not grow redundancy — it
# takes the running node down at the next restart. Upstream confirms there is
# no in-place path, for increases as well as decreases:
#   https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#replication_factor
#   https://git.deuxfleurs.fr/Deuxfleurs/garage/issues/1173
# Raising it is a whole-cluster migration (stop everything, purge the layout on
# every node, rebuild it, rebalance) — see "Changing the replication factor" in
# DATA_SHARING.md. tasks/garage.yml asserts config-vs-deployed before touching
# /etc/garage.toml so this can't happen by accident.
garage_replication_factor: 2
# Escape hatch for that assert. Only ever passed on the command line during the
# documented migration: -e garage_allow_replication_factor_change=true
garage_allow_replication_factor_change: false
# Read/write quorum behavior. "consistent" enforces read-after-write and is
# the safe default. See the reference for degraded/dangerous modes.
garage_consistency_mode: "consistent"
# --- Cluster nodes ---
# One entry per node. This single list drives both the cluster layout
# (garage_bootstrap assigns each node from it) and each node's
# bootstrap_peers. Adding a node = an entry here + a line in the [garage]
# inventory group; no task or template edits.
#
# host:     must match inventory_hostname.
# zone:     replicas are spread across zones first, so nodes that can fail
#           together belong in the same zone. Only meaningful at replication
#           factor >= 2, but set it truthfully now — a node's zone is fixed at
#           assign time, and changing it later means re-running
#           `garage layout assign` for that node by hand.
# capacity: relative weight AND a real cap on what the node stores. Keep it
#           comfortably under the free space of the disk holding
#           garage_data_dir.
# rpc_addr: the node's Tailscale IP; it's what the node publishes as
#           rpc_public_addr, so it's the address other nodes dial.
# node_id:  from `garage node id -q` on that node, minus the @addr suffix.
#           Only knowable once Garage runs there, so a brand-new node has no
#           node_id until after its first real deploy. Peers without one are
#           simply left out of everyone's bootstrap_peers.
#
# garage.toml.j2 renders each host's bootstrap_peers as "every OTHER node with
# a node_id". Excluding the host's own entry is deliberate: it keeps a node's
# config from churning when an unrelated node is added, so adding a node
# doesn't restart the running cluster.
garage_nodes:
  - host: "do-medium"
    zone: "dc1" # Matches the live layout — do not rename in place
    capacity: "350G"
    rpc_addr: "100.85.59.117"
    node_id: "4d38659411275b4d17e3d7b37cb815c7fd11af058f13fec3b9457f14165adab0"
  - host: "closet-full-indexer"
    zone: "closet"
    capacity: "350G"
    rpc_addr: "100.102.164.115"
    node_id: "6fac173c7f76086cc2a2a63d26e309c47ec4b84300b0a5d4e70607a0939b2e98"

# We have mostly 'large files'
garage_block_size: "10M"

# --- Buckets ---
# One entry per bucket/environment. Each carries the two archiver keys it needs:
#   write_key  — read+write, used by the archiver to UPLOAD Parquet (archiver-sync).
#   verify_key — read-only, used by the archiver's retention pass to read exported
#                Parquet back and verify it before dropping DB chunks (least
#                privilege: a deletion bug can never mutate the bucket).
# Add a bucket here to provision a whole new environment; garage_bootstrap creates
# each bucket + write_key, and tasks/garage_keys.yml creates each verify_key. Fetch
# key secrets with `garage key info --show-secret <name>` and place the verify-key
# creds in vault as archiver_verify_s3_keys, keyed by the archiver instance UUID.
# The FIRST entry is treated as the public/prod bucket that researcher reader keys
# are granted read on (see garage_reader_keys below).
#
# Each writer gets its own bucket and its own key — staging and prod are separate.
# Write secrets go in the Ansible vault as archiver_sync_s3_keys /
# controller_sync_s3_keys, keyed by instance UUID. See the example vault for an
# example.
garage_buckets:
  - name: "gossip-observer-data"
    write_key: "archiver-sync"
    verify_key: "archiver-verify"
  - name: "gossip-observer-data-staging"
    write_key: "archiver-staging-sync"
    verify_key: "archiver-staging-verify"
  - name: "gossip-collector-packet-captures"
    write_key: "packet-capture-sync"
    verify_key: "packet-capture-verify"
  - name: "gossip-graph-dump"
    write_key: "graph-dump-sync"
    verify_key: "graph-dump-verify"
  - name: "gossip-graph-dump-staging"
    write_key: "graph-dump-staging-sync"
    verify_key: "graph-dump-staging-verify"

# Public/prod bucket that per-researcher reader keys are granted read access on.
garage_public_bucket: "{{ garage_buckets[0].name }}"

# --- Per-researcher read-only keys ---
# Add a name to provision a new key; remove to revoke.
garage_reader_keys:
  - internal
  - alice
  - office
  - visualizer
  - and
  - fab
