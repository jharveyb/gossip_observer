# Installs Caddy from the official Cloudsmith apt repo and templates a
# Caddyfile that listens on loopback and reverse-proxies to Garage's S3
# API. Public traffic reaches Caddy via Cloudflare Tunnel (cloudflared);
# no public port is opened in UFW.

- name: Check Tailscale is available
  ansible.builtin.fail:
    msg: "Tailscale interface (tailscale0) not found. Ensure Tailscale is installed and running."
  when: ansible_facts['tailscale0'] is not defined

- name: Get Tailscale IP address
  ansible.builtin.set_fact:
    tailscale_ip: "{{ ansible_facts['tailscale0']['ipv4']['address'] }}"

- name: Install Caddy apt repo signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    owner: root
    group: root
    mode: "0644"

# deb822_repository parses and emits .sources files with python-debian, which
# isn't installed on a minimal Debian image. The module can install it itself
# (install_python_debian), but that option only exists in ansible-core >= 2.20.
- name: Install python-debian (required by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_stale }}"

# We used to write this repo with apt_repository (deprecated; removed in
# ansible-core 2.25), which produced the one-line
# /etc/apt/sources.list.d/caddy-stable.list. deb822_repository writes
# caddy-stable.sources instead, so drop the old file — otherwise apt sees the
# same repo configured twice on already-provisioned hosts.
- name: Remove legacy one-line Caddy apt repo
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/caddy-stable.list
    state: absent

- name: Install Caddy apt repo
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: /etc/apt/keyrings/caddy-stable.asc
    state: present
  register: caddy_repo

# Unlike apt_repository, deb822_repository never refreshes the apt cache —
# the caller has to do it based on the module's changed state.
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: "{{ caddy_repo is changed }}"

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload Caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: reloaded
