- name: Update pkg cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_stale }}"

- name: Basic pkgs
  ansible.builtin.apt:
    name: "{{ base_pkgs }}"
    state: present

- name: Baremetal pkgs
  ansible.builtin.apt:
    name: "{{ baremetal_pkgs }}"
    state: present
  when: "'baremetal' in group_names"

# Log rotation moved in-process (the daemons' log janitor compresses and
# expires their own files), so the old logrotate config + timer are torn down.
# The stock Debian logrotate.timer also processed /etc/logrotate.d/gossip, so
# the config file removal is what actually stops external rotation.
- name: Stop and disable gossip logrotate timer
  ansible.builtin.systemd:
    name: gossip-logrotate.timer
    enabled: false
    state: stopped
  # Hosts provisioned after the removal never had the unit.
  failed_when: false

- name: Remove gossip logrotate config and systemd units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/gossip
    - /etc/systemd/system/gossip-logrotate.timer
    - /etc/systemd/system/gossip-logrotate.service
    # The enablement symlink, in case the stop/disable above was skipped
    # by its failed_when guard.
    - /etc/systemd/system/timers.target.wants/gossip-logrotate.timer
  register: logrotate_removal

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: logrotate_removal is changed

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy journald config
  ansible.builtin.template:
    src: journald-gossip.conf.j2
    dest: /etc/systemd/journald.conf.d/gossip.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd config
    - Restart journald
