# Dev-environment VM setup: Determinate Nix + direnv/nix-direnv so the repo's
# flake.nix devShell loads on cd. Assumes server_init.yml (user, locale, base
# pkgs — incl. git and tmux) and tailscale_init.yml have already run against
# this host. For a local TimescaleDB (just gen-sql), also add the host to the
# [timescale] group and run timescaledb_init.yml — the version pins and gate
# apply there unchanged.

- name: Dev env packages
  ansible.builtin.apt:
    name:
      - curl
      - xz-utils
      - direnv
    state: present

- name: Check for existing Nix install
  ansible.builtin.stat:
    path: /nix/var/nix/profiles/default/bin/nix
  register: nix_binary

# Multi-user (daemon) install; flakes are enabled by default. The installer is
# not idempotent, hence the stat guard. Uninstall: /nix/nix-installer uninstall
- name: Install Determinate Nix
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
        | sh -s -- install --determinate --no-confirm
    executable: /bin/bash
  when: not nix_binary.stat.exists
  changed_when: true

# Determinate Nix reserves nix.conf for itself; operator settings belong in
# nix.custom.conf. Trusting the dev user lets flake substituters/settings from
# nix.conf-affecting flakes apply without prompts.
- name: Trust the dev user in the Nix daemon
  ansible.builtin.lineinfile:
    path: /etc/nix/nix.custom.conf
    line: "trusted-users = root {{ nonroot_username }}"
    regexp: "^trusted-users ="
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart nix-daemon

# nix-direnv caches the flake eval so a new shell prompt is instant; plain
# direnv's `use flake` would re-evaluate every time.
- name: Probe for nix-direnv in the dev user's profile
  become: true
  become_user: "{{ nonroot_username }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      nix profile list | grep -q nix-direnv
    executable: /bin/bash
  register: nix_direnv_probe
  failed_when: false
  changed_when: false

- name: Install nix-direnv into the dev user's profile
  become: true
  become_user: "{{ nonroot_username }}"
  ansible.builtin.shell:
    cmd: |
      . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      nix profile install nixpkgs#nix-direnv
    executable: /bin/bash
  when: nix_direnv_probe.rc != 0
  changed_when: true

- name: Create direnv config directory
  ansible.builtin.file:
    path: "/home/{{ nonroot_username }}/.config/direnv"
    state: directory
    owner: "{{ nonroot_username }}"
    group: "{{ nonroot_username }}"
    mode: "0755"

- name: Configure direnv to use nix-direnv
  ansible.builtin.lineinfile:
    path: "/home/{{ nonroot_username }}/.config/direnv/direnvrc"
    line: "source $HOME/.nix-profile/share/nix-direnv/direnvrc"
    create: true
    owner: "{{ nonroot_username }}"
    group: "{{ nonroot_username }}"
    mode: "0644"

- name: Enable direnv bash hook
  ansible.builtin.lineinfile:
    path: "/home/{{ nonroot_username }}/.bashrc"
    line: 'eval "$(direnv hook bash)"'
    create: true
    owner: "{{ nonroot_username }}"
    group: "{{ nonroot_username }}"
    mode: "0644"
