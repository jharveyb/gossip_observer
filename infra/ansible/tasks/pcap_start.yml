# Start a packet capture (+ socket-map sidecar) for this label.
#
# Requires: host_collectors, public_interface, public_ip, pcap_* vars
#
# One capture per host. Splitting into per-collector files happens offline from
# sockmap.tsv (scripts/split_pcap_by_collector.py), NOT at capture time: a BPF
# filter is compiled once when dumpcap starts and cannot be changed on a live
# socket, so a per-instance filter built from the ports an instance holds right
# now silently misses every connection established afterwards -- including the
# initial gossip sync burst, which is the interesting part. The offline split
# produces the same per-collector files with no such gap.

- name: Create capture directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pcap_dir_root }}", owner: "{{ nonroot_username }}", mode: "0755" }
    - { path: "{{ pcap_dir }}", owner: "{{ nonroot_username }}", mode: "0755" }
    - { path: "{{ pcap_conf_dir }}", owner: root, mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Deploy the socket-map sampler
  ansible.builtin.copy:
    src: gossip_pcap_sockmap.sh
    dest: /usr/local/bin/gossip_pcap_sockmap.sh
    owner: root
    group: root
    mode: "0755"

- name: Install packet capture systemd templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - gossip-pcap@.service
    - gossip-pcap-sockmap@.service
  register: pcap_unit_templates

- name: Reload systemd if unit templates changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: pcap_unit_templates is changed

# --- Filter assembly ---

- name: Build the base capture filter
  ansible.builtin.set_fact:
    pcap_base_filter: >-
      tcp and not port 22{% for p in pcap_tor_ports | default([]) %} and not port {{ p }}{% endfor %}
      {%- for h in pcap_tor_hosts | default([]) %} and not host {{ h }}{% endfor %}
      {{- (' and ' ~ pcap_filter_extra) if pcap_filter_extra | length > 0 else '' }}

- name: Show the assembled filter
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} base filter: {{ pcap_base_filter }}"

# --- Environment file, shared by the capture and the sockmap sidecar ---

- name: Write the capture environment file
  ansible.builtin.template:
    src: pcap_capture.env.j2
    dest: "{{ pcap_conf_dir }}/{{ pcap_label }}.env"
    owner: root
    group: root
    mode: "0644"
  vars:
    pcap_env_filter: "{{ pcap_base_filter }}"
    pcap_env_out: "{{ pcap_dir }}/{{ inventory_hostname }}-{{ pcap_label }}.{{ pcap_format }}"

- name: Record capture metadata for the offline splitter
  ansible.builtin.copy:
    content: "{{ pcap_meta | to_nice_json }}\n"
    dest: "{{ pcap_dir }}/capture_meta.json"
    owner: "{{ nonroot_username }}"
    group: "{{ nonroot_username }}"
    mode: "0644"
  vars:
    pcap_meta:
      label: "{{ pcap_label }}"
      host: "{{ inventory_hostname }}"
      format: "{{ pcap_format }}"
      interface: "{{ pcap_iface }}"
      public_ip: "{{ public_ip }}"
      base_filter: "{{ pcap_base_filter }}"
      dumpcap_args: "{{ pcap_args }}"
      started_utc: "{{ ansible_date_time.iso8601 }}"
      tor_hosts_excluded: "{{ pcap_tor_hosts | default([]) }}"
      # Read by split_pcap_by_collector.py to flag peers the filter dropped.
      excluded_ports: "{{ ([22] + (pcap_tor_ports | default([]))) | map('int') | list }}"
      collectors: "{{ host_collectors | map(attribute='uuid') | list }}"

- name: Start the socket-map sidecar
  ansible.builtin.systemd:
    name: "gossip-pcap-sockmap@{{ pcap_label }}"
    state: started

- name: Start the host capture
  ansible.builtin.systemd:
    name: "gossip-pcap@{{ pcap_label }}"
    state: started

- name: Capture started
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: capture '{{ pcap_label }}' running,
      output in {{ pcap_dir }}. Check with:
      ansible-playbook pcap_capture.yml --tags status -e pcap_label={{ pcap_label }}
