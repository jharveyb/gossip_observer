# Report on a running (or finished) capture.
#
# Requires: pcap_label, pcap_dir

- name: Probe capture state
  ansible.builtin.shell: |
    set -o pipefail
    echo "== units =="
    systemctl list-units --plain --no-legend --all \
      'gossip-pcap@{{ pcap_label }}.service' \
      'gossip-pcap@{{ pcap_label }}.*.service' \
      'gossip-pcap-sockmap@{{ pcap_label }}.service' 2>/dev/null \
      | awk '{ printf "%-52s %s/%s\n", $1, $3, $4 }' || true
    echo
    echo "== capture files =="
    if [ -d '{{ pcap_dir }}' ]; then
      ls -lh --time-style=+%H:%M:%S '{{ pcap_dir }}' | tail -n +2 | awk '{ printf "%8s  %s  %s\n", $5, $6, $7 }'
      echo
      echo "total: $(du -sh '{{ pcap_dir }}' 2>/dev/null | cut -f1)"
    else
      echo "(no capture directory {{ pcap_dir }})"
    fi
    echo
    echo "== sockmap =="
    if [ -f '{{ pcap_dir }}/sockmap.tsv' ]; then
      rows=$(grep -cv '^#' '{{ pcap_dir }}/sockmap.tsv' || echo 0)
      uuids=$(grep -v '^#' '{{ pcap_dir }}/sockmap.tsv' | cut -f2 | sort -u | wc -l)
      conns=$(grep -v '^#' '{{ pcap_dir }}/sockmap.tsv' | cut -f2,3,4,5 | sort -u | wc -l)
      echo "rows=$rows distinct_instances=$uuids distinct_connections=$conns"
      grep -v '^#' '{{ pcap_dir }}/sockmap.tsv' | cut -f2 | sort | uniq -c | sort -rn \
        | awk '{ printf "  %-38s %s samples\n", $2, $1 }'
    else
      echo "(no sockmap.tsv)"
    fi
    echo
    echo "== free space =="
    df -h '{{ pcap_dir_root }}' 2>/dev/null | tail -1
  args:
    executable: /bin/bash
  register: pcap_status_probe
  changed_when: false
  failed_when: false
  check_mode: false # pure reporting; skipping it under --check prints nothing

- name: Show capture status
  ansible.builtin.debug:
    msg: "{{ ([''] + [inventory_hostname + ' / ' + pcap_label] + pcap_status_probe.stdout_lines) }}"
