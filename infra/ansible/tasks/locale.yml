- name: Install locales
  ansible.builtin.apt:
    name: locales
    state: present

- name: Generate locale
  locale_gen:
    name: "{{ locale }}"
    state: present

# Write /etc/default/locale directly (what `update-locale` edits) instead of
# `localectl set-locale`: localectl needs a polkit-authorized D-Bus call to
# systemd-localed, and minimal Debian images without polkitd (and unprivileged
# LXC containers) deny it even for root — "Failed to issue method call:
# Access denied". Takes effect on next login, same as localectl.
- name: Set default locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ locale }}"
    create: true
    owner: root
    group: root
    mode: "0644"
