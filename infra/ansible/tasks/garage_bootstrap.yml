# One-time cluster bootstrap. All tasks run_once on the first host in the
# [garage] group, so repeated plays (or future multi-node expansions) don't
# re-bootstrap.
#
# This task is idempotent against three failure modes:
#   - Cluster never initialized: creates layout v1, every bucket in
#     garage_buckets, and each bucket's read+write key.
#   - Cluster partially initialized (layout applied but bootstrap failed
#     later): detects existing layout/buckets/keys and picks up where the
#     previous run left off.
#   - Cluster fully initialized: all tasks short-circuit.
#
# Key credentials are NOT persisted to disk — `garage key info --show-secret
# <name>` is the source of truth, queried on demand by rclone_sync.yml and
# the show_keys task.
#
# To expand from 1 → N nodes later:
#   1. Add the host to [garage] and add a garage_nodes entry (zone, capacity,
#      rpc_addr). Leave node_id out until the node has run once.
#   2. Re-run the playbook, ideally with --limit <newhost>: the existing nodes'
#      configs don't depend on the new entry, so nothing restarts. The
#      layout-version detection below sees the new node missing from the
#      current layout, assigns it, and applies version <current+1>.
#   3. Fill in the new node's node_id from `garage node id -q` so the other
#      nodes list it as a bootstrap peer on their next config deploy.
#
# Do NOT also bump garage_replication_factor as part of that: the factor is
# stored in the cluster layout, and a node whose config disagrees with its
# stored layout refuses to start. Growing redundancy is a separate offline
# migration — see "Changing the replication factor" in DATA_SHARING.md.

# check_mode: false so a --check run against a live cluster still reads real
# node IDs. On a host where Garage isn't installed yet that command genuinely
# cannot succeed, so under --check we tolerate the failure and leave
# garage_node_id unset — the layout loop below skips hosts without it. Outside
# check mode a missing node ID is still fatal.
- name: Gather local Garage node ID
  ansible.builtin.command: garage node id -q
  register: garage_node_id_result
  changed_when: false
  check_mode: false
  failed_when: garage_node_id_result.rc != 0 and not ansible_check_mode

- name: Store node ID as fact
  ansible.builtin.set_fact:
    garage_node_id: "{{ garage_node_id_result.stdout.split('@')[0] }}"
  when: garage_node_id_result.rc == 0

- name: Report that this host's node ID is unavailable
  ansible.builtin.debug:
    msg: >-
      Could not read a Garage node ID from {{ inventory_hostname }}
      (`garage node id -q` rc={{ garage_node_id_result.rc }}). Garage is not
      installed and running here yet, which --check cannot change, so this
      host's layout assignment can't be previewed. Re-run without --check to
      install it, then dry-run again.
  when: garage_node_id_result.rc != 0

- name: Bootstrap Garage cluster (layout + buckets + write keys)
  run_once: true
  delegate_to: "{{ groups['garage'][0] }}"
  block:
    # --- Layout ---
    # `garage layout apply --version N` requires N == current_version + 1, so
    # we read the current version from `layout show` rather than hardcoding 1.
    - name: Fetch current cluster layout
      ansible.builtin.command: garage layout show
      register: garage_layout_show
      changed_when: false

    - name: Parse current layout version
      ansible.builtin.set_fact:
        garage_current_layout_version: >-
          {{ ((garage_layout_show.stdout
               | regex_findall('Current cluster layout version:\s*(\d+)'))
              + ['0']) | first | int }}

    - name: Assign each Garage node to the layout if missing
      ansible.builtin.command:
        cmd: >-
          garage layout assign {{ hostvars[item.host].garage_node_id }}
          --zone {{ item.zone }}
          --capacity {{ item.capacity }}
          --tag {{ item.host }}
      loop: "{{ garage_nodes }}"
      loop_control:
        label: "{{ item.host }}"
      register: garage_layout_assign
      changed_when: true
      when:
        # No fact = the host isn't in this play (--limit), or it failed before
        # reaching the node-ID task. Skip it rather than templating an
        # undefined into the command.
        - hostvars[item.host].garage_node_id is defined
        # Match on the first 16 hex chars (short form used by `layout show`).
        - hostvars[item.host].garage_node_id[:16] not in garage_layout_show.stdout

    # Ansible aggregates a top-level `changed` over all iterations of a looped
    # task, so this covers "any node was newly assigned".
    - name: Apply layout if any node was newly assigned
      ansible.builtin.command:
        cmd: "garage layout apply --version {{ garage_current_layout_version | int + 1 }}"
      when: garage_layout_assign.changed
      changed_when: true

    # --- Buckets (one per environment; see garage_buckets in group_vars) ---
    - name: Check whether each bucket exists
      ansible.builtin.command: "garage bucket info {{ item.name }}"
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.name }}"
      register: garage_bucket_probes
      changed_when: false
      failed_when: false

    - name: Create missing buckets
      ansible.builtin.command: "garage bucket create {{ probe.item.name }}"
      loop: "{{ garage_bucket_probes.results }}"
      loop_control:
        loop_var: probe
        label: "{{ probe.item.name }}"
      when: probe.rc != 0
      changed_when: true

    # --- Per-bucket write keys (read+write, used by the archiver to upload) ---
    - name: Check whether each write key exists
      ansible.builtin.command: "garage key info {{ item.write_key }}"
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.write_key }}"
      register: garage_write_key_probes
      changed_when: false
      failed_when: false

    - name: Create missing write keys
      ansible.builtin.command: "garage key create {{ probe.item.write_key }}"
      loop: "{{ garage_write_key_probes.results }}"
      loop_control:
        loop_var: probe
        label: "{{ probe.item.write_key }}"
      when: probe.rc != 0
      changed_when: true

    # Idempotent: Garage accepts re-granting existing permissions as a no-op.
    - name: Grant each write key read+write on its bucket
      ansible.builtin.command:
        cmd: >-
          garage bucket allow
          --read --write
          --key {{ item.write_key }}
          {{ item.name }}
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.write_key }} -> {{ item.name }}"
      changed_when: true

    # Read-only verify keys (retention pass) are provisioned in the re-runnable
    # tasks/garage_keys.yml, alongside the per-researcher reader keys — they're
    # ongoing key management, not one-time cluster bootstrap.
