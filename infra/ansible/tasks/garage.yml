# Compute whether data_dir is "external" — i.e. outside the systemd
# StateDirectory tree. External paths need to be pre-created, pre-chowned,
# and added to the service's ReadWritePaths (done via garage.service.j2).
- name: Detect external Garage data_dir
  ansible.builtin.set_fact:
    garage_data_dir_is_external: "{{ not garage_data_dir.startswith('/var/lib/garage/') }}"

- name: Get Tailscale IP address
  ansible.builtin.set_fact:
    tailscale_ip: "{{ ansible_facts['tailscale0']['ipv4']['address'] }}"

- name: Create garage system group
  ansible.builtin.group:
    name: garage
    system: true

- name: Create garage system user
  ansible.builtin.user:
    name: garage
    group: garage
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    home: /var/lib/garage

- name: Create Garage config directory
  ansible.builtin.file:
    path: /etc/garage
    state: directory
    owner: root
    group: root
    mode: "0755"

# Pre-create the external data_dir with garage:garage ownership. This runs
# only when data_dir lives outside /var/lib/garage — otherwise systemd's
# StateDirectory=garage handles it. Intentionally does NOT create the mount
# itself; the filesystem must already be mounted at the parent path.
- name: Ensure external data_dir exists with garage ownership
  ansible.builtin.file:
    path: "{{ garage_data_dir }}"
    state: directory
    owner: garage
    group: garage
    mode: "0750"
  when: garage_data_dir_is_external

- name: Verify external data_dir parent is a mountpoint
  ansible.builtin.command: findmnt --target "{{ garage_data_dir }}"
  register: garage_data_dir_mount
  changed_when: false
  failed_when: false
  when: garage_data_dir_is_external

- name: Warn if external data_dir is not on a separate mount
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ garage_data_dir }} resolves to {{ garage_data_dir_mount.stdout_lines[1] | default('') }}
      which appears to be on the root filesystem. If you intended to put
      Garage data on a separate disk, mount it at or above {{ garage_data_dir }}
      before continuing.
  when:
    - garage_data_dir_is_external
    - garage_data_dir_mount.rc == 0
    - "'/' == (garage_data_dir_mount.stdout_lines[1].split() | first | default(''))"

# The unit runs as User=garage, so EVERY directory on the way to data_dir must
# be traversable (+x) by that user — not just data_dir itself. The task above
# creates data_dir as root, which hides a restrictive ancestor (e.g. a mount
# root at 0700 owned by another service's user). Without this check the first
# symptom is a crash loop after deploy:
- name: Probe whether the garage user can traverse to the external data_dir
  ansible.builtin.command: "runuser -u garage -- test -x {{ garage_data_dir | dirname }}"
  register: garage_data_dir_traverse
  changed_when: false
  failed_when: false
  check_mode: false
  when: garage_data_dir_is_external

- name: Collect the permission chain when traversal fails
  ansible.builtin.command: "namei -l {{ garage_data_dir }}"
  register: garage_data_dir_namei
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - garage_data_dir_is_external
    - garage_data_dir_traverse.rc != 0

- name: Assert the garage user can reach the external data_dir
  ansible.builtin.assert:
    that: garage_data_dir_traverse.rc == 0
    fail_msg: |-
      The garage service user cannot traverse to {{ garage_data_dir }} on
      {{ inventory_hostname }}. Garage would start, fail to open its data
      directory, and crash-loop:
        Error: Unable to create Garage data directory: {{ garage_data_dir }}: Permission denied
      This is a PARENT directory permission, not data_dir's own — data_dir is
      created garage:garage by the task above. Chain:
      {{ garage_data_dir_namei.stdout | default('(namei unavailable)') }}
      Give the offending directory +x for the garage user (e.g.
      `chmod 0755 {{ garage_data_dir | dirname }}`) and re-run.
    success_msg: "garage can traverse to {{ garage_data_dir }}"
  when: garage_data_dir_is_external

# Pre-built musl binary from the upstream release.
# https://garagehq.deuxfleurs.fr/download/
- name: Download Garage binary
  ansible.builtin.get_url:
    url: "https://garagehq.deuxfleurs.fr/_releases/v{{ garage_version }}/x86_64-unknown-linux-musl/garage"
    dest: "/usr/local/bin/garage"
    owner: root
    group: root
    mode: "0755"
    force: false

# Guard against the one config change that cannot be rolled out by redeploying
# a template: the replication factor is stored in the cluster layout, so a node
# whose new config disagrees with its existing layout refuses to start. Catch
# it BEFORE the template task below notifies Restart Garage, otherwise the
# first symptom is a node that never comes back. A host with no /etc/garage.toml
# yet (a brand-new node) has nothing to disagree with and is skipped.
- name: Read deployed Garage configuration (if any)
  ansible.builtin.slurp:
    src: /etc/garage.toml
  register: garage_deployed_config
  failed_when: false
  check_mode: false

- name: Assert the replication factor matches the deployed one
  vars:
    garage_deployed_replication_factor: >-
      {{ (garage_deployed_config.content | b64decode
          | regex_findall('^\s*replication_factor\s*=\s*(\d+)', multiline=True)
          + ['0']) | first | int }}
  ansible.builtin.assert:
    that: garage_deployed_replication_factor | int == garage_replication_factor | int
    fail_msg: >-
      {{ inventory_hostname }} is running Garage with replication_factor
      {{ garage_deployed_replication_factor }}, but garage_replication_factor is
      {{ garage_replication_factor }}. Deploying that would restart Garage into a
      config that disagrees with its stored cluster layout, and the node would
      refuse to start. The factor cannot be changed in place — see "Changing the
      replication factor" in DATA_SHARING.md for the offline migration, which
      re-runs this play with -e garage_allow_replication_factor_change=true.
    success_msg: "replication_factor {{ garage_replication_factor }} matches the deployed config"
  when:
    - not (garage_allow_replication_factor_change | default(false) | bool)
    - garage_deployed_config.content is defined

- name: Deploy Garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /etc/garage.toml
    owner: root
    group: garage
    mode: "0640"
  notify: Restart Garage
  register: garage_config

- name: Install Garage systemd service
  ansible.builtin.template:
    src: garage.service.j2
    dest: /etc/systemd/system/garage.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd config
    - Restart Garage

- name: Enable and start Garage
  ansible.builtin.systemd:
    name: garage
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Garage admin API to respond
  ansible.builtin.wait_for:
    host: "{{ tailscale_ip }}"
    port: "{{ garage_admin_bind_port }}"
    timeout: 30

- name: Bootstrap cluster layout
  ansible.builtin.import_tasks: garage_bootstrap.yml
  tags:
    - garage_bootstrap

- name: Create or reconcile reader keys
  ansible.builtin.import_tasks: garage_keys.yml
  tags:
    - garage_keys

# Display-only helper for operators onboarding researchers. Never runs in a
# normal playbook invocation — only when the `show_keys` tag is requested.
- name: Show Garage key credentials (tag-gated)
  ansible.builtin.import_tasks: show_garage_keys.yml
  tags:
    - never
    - show_keys
