---
- name: Configure Observer Controller servers
  hosts: controllers
  become: true

  pre_tasks:
    # Load S3 creds
    - name: Load vault variables
      ansible.builtin.include_vars: vault.yml

  tasks:
    - name: Observer Controller setup
      ansible.builtin.import_tasks: tasks/observer_controller.yml

  handlers:
    - name: Import handlers
      ansible.builtin.import_tasks: handlers/main.yml
